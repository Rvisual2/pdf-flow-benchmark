[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prod-pdfbenchmark"
version = "0.1.0"
description = "Extensible PDF-to-Markdown conversion and reading-flow evaluation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clean-text>=0.6.0",
    "docling==2.126.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "datalab-python-sdk==0.5.0",
    "llama-cloud==2.16.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pymupdf==1.28.2", # Also used internally for ground-truth annotation extraction.
    "pymupdf4llm==1.28.2",
    "rapidfuzz>=3.14.0",
    "reductoai[aiohttp]==0.24.0",
    "torch>=2.9.1",
    "unidecode>=1.4.0",
]

[project.scripts]
pdf-benchmark = "pdf_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_benchmark = ["resources/*.md", "resources/*.json"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
